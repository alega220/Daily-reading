<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f2a4a">
<title>DC Rounds</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#14202e;--mu:#667585;--bd:#e2e8f0;--pr:#2563eb;--ok:#16a34a;--rd:#dc2626;--hd:#0f2a4a;--in:#f8fafc;--sh:0 1px 2px #0000000f,0 6px 18px #0000000d}
@media(prefers-color-scheme:dark){:root{--bg:#0c1522;--card:#152234;--tx:#e8eef6;--mu:#94a3b8;--bd:#24354b;--pr:#3b82f6;--hd:#09111c;--in:#0f1b2b;--sh:0 1px 2px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.4}
header{background:var(--hd);color:#fff;padding:.7rem 1rem;display:flex;gap:.5rem;align-items:center;position:sticky;top:0;z-index:5;padding-top:calc(.7rem + env(safe-area-inset-top,0px))}
header b{flex:1;font-size:1.1rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#ffffff22;color:#fff;padding:.4rem .7rem;font-size:.85rem}
main{max-width:680px;margin:auto;padding:1rem 1rem 5rem}
h2{font-size:1.25rem;margin:.4rem 0 .8rem}
.card{background:var(--card);border-radius:16px;padding:1rem;margin-bottom:.9rem;box-shadow:var(--sh);border:1px solid var(--bd)}
button{font:inherit;font-weight:600;font-size:.95rem;padding:.75rem 1.1rem;border:0;border-radius:12px;background:var(--pr);color:#fff;cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}button.g{background:var(--in);color:var(--tx);border:1px solid var(--bd)}
button.r{background:var(--rd)}button.ok{background:var(--ok)}button.sm{padding:.45rem .8rem;font-size:.85rem}button.full{width:100%}
input,select,textarea{font:inherit;font-size:1rem;width:100%;padding:.75rem .85rem;border:1.5px solid var(--bd);border-radius:12px;margin:.25rem 0 .8rem;background:var(--in);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px #2563eb33}
label{font-size:.8rem;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
.item{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:1rem;margin-bottom:.6rem;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);cursor:pointer}
.item.done{border-left:6px solid var(--ok)}.item small{display:block}
.item .ch{color:var(--mu);font-size:1.4rem;line-height:1}
small,.mu{color:var(--mu);font-size:.85rem}
.chip{display:inline-block;padding:.15rem .65rem;border-radius:99px;font-size:.78rem;font-weight:650}
.c-due{background:#fef3c7;color:#92400e}.c-ok{background:#dcfce7;color:#166534}.c-al{background:#fee2e2;color:#991b1b}
.row2{display:flex;gap:.6rem}.row2>button{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.8rem}
.prog{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:.3rem 0 1rem}.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 .7rem}
.card.alarm{border-color:var(--rd);box-shadow:0 0 0 2px #dc262633}
.bottom{position:sticky;bottom:0;padding:.8rem 0;background:linear-gradient(#0000,var(--bg) 35%)}
.ov{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sh h3{margin:.1rem 0 1rem;font-size:1.2rem}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:8}
.nav button{flex:1;background:none;color:var(--mu);border-radius:0;display:flex;flex-direction:column;align-items:center;gap:.05rem;font-size:.75rem;padding:.55rem 0}
.nav button span{font-size:1.3rem}.nav button.on{color:var(--pr)}
.empty{text-align:center;color:var(--mu);padding:2rem 1rem}
</style></head><body>

/* bottom sheet form */
function sheet(title,body,ok){
  const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="sh"><h3>${title}</h3>${body}<div class="row2"><button class="g" id="x">Cancel</button><button id="o">Save</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#x').onclick=()=>d.remove();
  d.onclick=e=>{if(e.target===d)d.remove()};
  d.querySelector('#o').onclick=async()=>{if(await ok(d)!==false)d.remove()};
  const f=d.querySelector('input');if(f)f.focus();
}
const val=(d,n)=>d.querySelector(`[name=${n}]`).value.trim();

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return loginView();
  me=session.user;
  const {data:p}=await sb.from('profiles').select('role,full_name').eq('id',me.id).maybeSingle();
  isAdmin=p?.role==='admin'; myName=first(p?.full_name||me.email.split('@')[0]);
  await load(); home();
}
async function load(){
  const [s,r,p]=await Promise.all([sb.from('sites').select('*').order('name'),sb.from('rooms').select('*').order('name'),sb.from('panels').select('*').order('name')]);
  S={sites:s.data||[],rooms:r.data||[],panels:p.data||[]};
}
function head(){
  $('#hb').innerHTML=`<button onclick="setFs(-1)">A−</button><button onclick="setFs(1)">A+</button>`+
  `<button onclick="sb.auth.signOut().then(()=>location.reload())">Out</button>`;
}
function loginView(){
  $('#nav').style.display='none';
  $('#hb').innerHTML=`<button onclick="setFs(-1)">A−</button><button onclick="setFs(1)">A+</button>`;
  app.innerHTML=`<div class="card" style="margin-top:12vh"><h2>Sign in</h2><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button class="full" onclick="login()">Sign in</button><p id="err" style="color:var(--rd)"></p></div>`;
}
async function login(){
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error) $('#err').textContent=error.message; else init();
}

/* ---------- NAV ---------- */
function nav(t){
  const n=$('#nav'); if(!t){n.style.display='none';return}
  n.style.display='flex';
  const tabs=[['rounds','📋','Rounds'],['history','🗂️','History']];
  if(isAdmin)tabs.push(['admin','⚙️','Admin']);
  n.innerHTML=tabs.map(([k,i,l])=>`<button class="${k===t?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
}
function go(k){adminMode=k==='admin';adm={};k==='history'?historyView():k==='admin'?home():home()}
const dayKey=t=>new Date(t).toLocaleDateString('en-CA');
let H=[],lastWb=null,myName='';

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const slotLbl=i=>`${pad(i*2)}:00–${pad(i*2+2)}:00`;
const hm=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const today=()=>dayKey(Date.now());
const first=n=>{n=String(n||'').trim().split(/[\s._@-]/)[0];return n?n[0].toUpperCase()+n.slice(1).toLowerCase():''};
const rinfo=r=>({d:r.walk_date||dayKey(r.started_at),s:r.walk_slot??Math.floor(new Date(r.started_at).getHours()/2)});
const names=rs=>[...new Set(rs.map(r=>r.tech_name||first(r.user_email)).filter(Boolean))].join(' & ');
const dateLbl=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'});
async function dayRounds(sid,d){
  const {data,error}=await sb.from('rounds').select('*').eq('site_id',sid).gte('started_at',new Date(Date.now()-33*864e5).toISOString()).order('started_at');
  if(error){alert(error.message);return []}
  return (data||[]).filter(r=>rinfo(r).d===d);
}

      p.fields.forEach(f=>{
        const v=x.vals?.[f], c=LAYOUT[p.name]?.[fbase(f)];
        if(c&&v!=null&&v!=='') g[c]=(typeof v==='number'&&String(ws.getCell(c).numFmt||'').includes('%'))?v/100:v; // % cells: type 55 -> 55%
        log.push([`Walk ${i+1} (${WALKS[i]})`,rm?.name,p.name,fbase(f),v,hm(x.taken_at),x.alarm,x.notes||'',who?.tech_name||first(who?.user_email)]);
      });
    });
    const rec=Object.keys(g).length>0, n=c=>Number(g[c])||0;
    Object.entries(g).forEach(([c,v])=>ws.getCell(c).value=v);
    ws.getCell('A2').value=rec?names(L):'Not recorded'; ws.getCell('C2').value=d; ws.getCell('E2').value=rec?hm(rows[0].taken_at):'';
    const v={H101:n('B7')*300,I101:n('E7')*300,H102:n('C17')*n('B17')/1000+n('C12')*n('B12')/1000+n('J7')*160,I102:n('H17')*n('G17')/1000+n('H12')*n('G12')/1000+n('M7')*160,H104:n('B26')-90,I104:n('E26')};
    v.J101=v.H101+v.I101;v.J102=v.H102+v.I102;v.J103=v.J101+v.J102;v.J104=v.H104+v.I104;v.G107=v.J104/v.J103;
    [...'BCDEFG'].forEach(c=>{const x=n(c+'23');v[c+'24']=(360<x&&x<420)?'OK':'Alarm'});
    for(const [c,r] of Object.entries(v)){const cell=ws.getCell(c);cell.value=rec&&(typeof r==='string'||isFinite(r))?{formula:FM[c],result:r}:null}
    V.push({rec,v});
  });
  /* Average PUE sheet: same formulas, averaged over the walks recorded */
  const R=V.filter(x=>x.rec), N=R.length, ref=(c,r)=>WALKS.map(w=>`'${w}'!${c}${r}`).join(',');
  const A=k=>N?R.reduce((s,x)=>s+x.v[k],0)/N:0, setF=(c,f,r)=>avg.getCell(c).value={formula:f,result:r};
  const setR=(c,r)=>{avg.getCell(c).value={formula:FM[c],result:r}};
  avg.getCell('C14').value='Walks recorded';
  setF('E14',WALKS.map(w=>`('${w}'!J103>0)`).join('+'),N);
  const f4=A('H101')-1.4,g4=A('I101')-1.4,f7=A('H102'),g7=A('I102'),f9=A('H104'),g9=A('I104');
  setF('F4',`IF($E$14=0,0,SUM(${ref('H',101)})/$E$14-F5)`,N?f4:0);
  setF('G4',`IF($E$14=0,0,SUM(${ref('I',101)})/$E$14-G5)`,N?g4:0);
  setF('F7',`IF($E$14=0,0,SUM(${ref('H',102)})/$E$14)`,f7);
  setF('G7',`IF($E$14=0,0,SUM(${ref('I',102)})/$E$14)`,g7);
  setF('F9',`IF($E$14=0,0,SUM(${ref('H',104)})/$E$14)`,f9);
  setF('G9',`IF($E$14=0,0,SUM(${ref('I',104)})/$E$14)`,g9);
  setF('E12',`IFERROR(AVERAGE(${ref('G',107)}),0)`,N?R.reduce((s,x)=>s+x.v.G107,0)/N:0);
  setR('H4',N?f4+g4:0);setR('H5',2.8);setR('H6',3);setR('H7',f7+g7);setR('H8',(N?f4+g4:0)+f7+g7+2.8+3);setR('H9',f9+g9);
  const ls=wb.addWorksheet('Readings Log');
  ls.columns=['Walk','Room','Panel','Parameter','Value','Time','Panel status','Notes','Technician'].map(h=>({header:h,width:18}));
  ls.addRows(log); ls.getRow(1).font={bold:true};
  return {buf:await wb.xlsx.writeBuffer(),name:`${st?.name||'site'}_${d}.xlsx`,subject:`Daily Report - ${st?.name||''} - ${d} - ${names(rs)}`};
}

async function dlDay(sid,d,btn){btn.disabled=true;btn.textContent='…';try{saveFile(await dayBook(sid,d))}catch(e){alert(e.message)}btn.disabled=false;btn.textContent='⬇ Excel'}

/* ---------- HISTORY (30 days) ---------- */
async function historyView(){
  head(); nav('history'); $('#ttl').textContent='History';
  app.innerHTML='<div class="empty">Loading…</div>';
  const {data,error}=await sb.from('rounds').select('*').eq('status','done').gte('started_at',new Date(Date.now()-31*864e5).toISOString()).order('started_at',{ascending:false});
  if(error) return app.innerHTML=`<div class="empty">${esc(error.message)}</div>`;
  const g={};(data||[]).forEach(r=>{const i=rinfo(r),k=i.d+'|'+r.site_id;(g[k]=g[k]||{d:i.d,sid:r.site_id,rs:[]}).rs.push(r)});
  const list=Object.values(g), days=[...new Set(list.map(x=>x.d))].sort().reverse();
  app.innerHTML='<small>Last 30 days · one Excel file per day (12 walk tabs)</small>'+(days.length?days.map(d=>
    `<h2 style="font-size:1rem;margin-top:1rem">${dateLbl(d)}</h2>`+list.filter(x=>x.d===d).map(x=>{
      const st=S.sites.find(z=>z.id===x.sid), n=new Set(x.rs.map(r=>rinfo(r).s)).size;
      return `<div class="card"><b>${esc(st?.name||'Site')}</b><br><small>${n} of 12 walks · ${esc(names(x.rs))}</small><br><br><div class="row2"><button class="g sm" onclick="dayView('${x.sid}','${d}')">View walks</button><button class="sm" onclick="dlDay('${x.sid}','${d}',this)">⬇ Excel</button></div></div>`}).join('')
  ).join(''):'<div class="empty">No finished walks in the last 30 days.</div>');
}

/* ---------- HOME ---------- */
async function home(){
  head(); $('#ttl').textContent='DC Rounds';
  if(adminMode){nav('admin');return adminView()}
  nav('rounds');
  const {data}=await sb.from('rounds').select('*').eq('status','done').gte('started_at',new Date(Date.now()-2*864e5).toISOString());
  const t=today(), cur=Math.floor(new Date().getHours()/2);
  app.innerHTML='<h2>Choose a site</h2>'+(S.sites.length?S.sites.map(s=>{
    const dn=new Set((data||[]).filter(r=>r.site_id===s.id).map(rinfo).filter(x=>x.d===t).map(x=>x.s)), ok=dn.has(cur);
    return `<div class="card"><div class="top"><b style="font-size:1.1rem">${esc(s.name)}</b><span class="chip ${ok?'c-ok':'c-due'}">${ok?'Walk done':'Walk '+(cur+1)+' due'}</span></div>
    <small>Today: ${dn.size} of 12 walks</small><br><br><button class="full" onclick="dayView('${s.id}','${t}')">Open today</button></div>`}).join(''):'<div class="empty">No sites yet.<br>Ask the admin to add one.</div>');
}

/* ---------- DAY: the 12 walks ---------- */
async function dayView(sid,d){
  site=S.sites.find(x=>x.id===sid); const isT=d===today();
  head(); nav(isT?'rounds':'history'); $('#ttl').textContent=site.name;
  app.innerHTML='<div class="empty">Loading…</div>';
  const rs=await dayRounds(sid,d), cur=Math.floor(new Date().getHours()/2), by={};
  rs.forEach(r=>{const i=rinfo(r).s;(by[i]=by[i]||[]).push(r)});
  app.innerHTML=`<div class="top"><button class="g sm" onclick="${isT?'home()':'historyView()'}">← Back</button><button class="sm" onclick="dlDay('${sid}','${d}',this)">⬇ Excel</button></div>
  <h2 style="margin-bottom:.2rem">${dateLbl(d)}</h2><small>${esc(names(rs))||'No technicians yet'}</small><br><br>`+
  Array.from({length:12},(_,i)=>{
    const L=by[i]||[], dn=L.find(r=>r.status==='done'), op=L.find(r=>r.status==='open');
    const chip=dn?`<span class="chip c-ok">Done ${hm(dn.finished_at)}</span>`:op?'<span class="chip c-due">In progress</span>':(isT&&i===cur?'<span class="chip c-due">Now</span>':(isT&&i<cur?'<span class="chip c-al">Missed</span>':''));
    const act=dn?`viewWalk('${dn.id}')`:(isT?`startWalk('${sid}','${d}',${i})`:'');
    return `<div class="item ${dn?'done':''}" ${act?`onclick="${act}"`:''}><span><b>Walk ${i+1} · ${slotLbl(i)}</b><small>${dn?esc(dn.tech_name||first(dn.user_email)):op?'Tap to resume':isT?'Tap to start':'Not recorded'}</small></span>${chip}</div>`}).join('');
}
async function startWalk(sid,d,i){
  site=S.sites.find(x=>x.id===sid);
  let {data:r}=await sb.from('rounds').select('*').eq('site_id',sid).eq('walk_date',d).eq('walk_slot',i).eq('status','open').eq('user_id',me.id).maybeSingle();
  if(!r){const x=await sb.from('rounds').insert({site_id:sid,user_email:me.email,tech_name:myName,walk_date:d,walk_slot:i}).select().single();if(x.error)return alert(x.error.message);r=x.data}
  round=r; roundView();
}
async function viewWalk(id){
  nav(null);
  const {data:r}=await sb.from('rounds').select('*').eq('id',id).single();
  const {data:rd}=await sb.from('readings').select('*').eq('round_id',id), i=rinfo(r);
  $('#ttl').textContent='Walk '+(i.s+1);
  app.innerHTML=`<div class="top"><button class="g sm" onclick="dayView('${r.site_id}','${i.d}')">← Walks</button><small>${slotLbl(i.s)} · ${esc(r.tech_name||first(r.user_email))}</small></div>`+
  (isAdmin?`<div class="card"><button class="g full" onclick="editWalk('${r.id}')">✏️ Edit readings</button></div>`:'')+
  S.rooms.filter(x=>x.site_id===r.site_id).map(rm=>{
    const ps=S.panels.filter(p=>p.room_id===rm.id).map(p=>({p,x:(rd||[]).find(y=>y.panel_id===p.id)})).filter(o=>o.x);
    return ps.length?`<h2 style="font-size:1rem">${esc(rm.name)}</h2>`+ps.map(({p,x})=>`<div class="card ${x.alarm!=='Normal'?'alarm':''}"><div class="top" style="margin:0 0 .4rem"><b>${esc(p.name)}</b><span class="chip ${x.alarm==='Normal'?'c-ok':'c-al'}">${esc(x.alarm)} · ${hm(x.taken_at)}</span></div>${p.fields.map(f=>`<div class="top" style="margin:0"><span class="mu">${esc(fbase(f))}</span><b>${esc(x.vals?.[f]??'')}</b></div>`).join('')}${x.notes?`<br><small>📝 ${esc(x.notes)}</small>`:''}</div>`).join(''):''}).join('');
}
async function editWalk(id){
  const {data:r}=await sb.from('rounds').select('*').eq('id',id).single();
  site=S.sites.find(x=>x.id===r.site_id);
  round=r; roundView();
}

/* ---------- ROUND ---------- */
async function roundView(){
  nav(null); $('#ttl').textContent=`Walk ${round.walk_slot+1} · ${site.name}`;
  const rooms=S.rooms.filter(r=>r.site_id===site.id&&S.panels.some(p=>p.room_id===r.id));
  const {data:rd}=await sb.from('readings').select('panel_id').eq('round_id',round.id);
  const got=new Set((rd||[]).map(x=>x.panel_id));
  const pn=r=>S.panels.filter(p=>p.room_id===r.id), isDone=r=>pn(r).every(p=>got.has(p.id));
  const n=rooms.filter(isDone).length, all=rooms.length&&n===rooms.length;
  app.innerHTML=`<div class="top"><button class="g sm" onclick="dayView('${site.id}','${round.walk_date}')">← Walks</button><small>${slotLbl(round.walk_slot)} · ${n} of ${rooms.length} rooms</small></div>
  <div class="prog"><i style="width:${rooms.length?n/rooms.length*100:0}%"></i></div>`+
  (rooms.length?rooms.map(r=>`<div class="item ${isDone(r)?'done':''}" onclick="roomView('${r.id}')"><span><b>${esc(r.name)}</b><small>${pn(r).filter(p=>got.has(p.id)).length}/${pn(r).length} panels</small></span><span class="ch">${isDone(r)?'✓':'›'}</span></div>`).join(''):'<div class="empty">This site has no rooms with panels yet.</div>')+
  ((round.status==='open'&&all)?`<div class="bottom"><button class="ok full" onclick="finish()">Finish walk & send report</button></div>`:'');
}
async function roomView(id){
  const room=S.rooms.find(r=>r.id===id), panels=S.panels.filter(p=>p.room_id===id);
  const {data:rd}=await sb.from('readings').select('*').eq('round_id',round.id);
  const by={};(rd||[]).forEach(x=>by[x.panel_id]=x);
  nav(null); $('#ttl').textContent=room.name;
  app.innerHTML=`<div class="top"><button class="g sm" onclick="roundView()">← Rooms</button></div>`+panels.map(p=>{
    const e=by[p.id]||{vals:{}}, al=e.alarm&&e.alarm!=='Normal';
    return `<div class="card ${al?'alarm':''}" data-p="${p.id}"><h2 style="margin-top:0">${esc(p.name)}</h2><div class="fields">`+
    p.fields.map(f=>{const t=ftype(f),v=e.vals?.[f]??'';return `<div><label>${esc(fbase(f))}</label>`+(t==='ok'?`<select data-f="${esc(f)}" data-t="ok"><option value="">—</option>${['OK','Alarm','Off'].map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input type="${t==='num'?'number':'text'}" ${t==='num'?'step="any" inputmode="decimal"':''} data-f="${esc(f)}" data-t="${t}" value="${esc(v)}">`)+`</div>`}).join('')+
    `</div><div class="fields"><div><label>Time</label><input type="time" class="tm" value="${hm(e.taken_at||Date.now())}"></div>
     <div><label>Status</label><select class="al" onchange="this.closest('.card').classList.toggle('alarm',this.value==='Alarm')"><option>Normal</option><option ${al?'selected':''}>Alarm</option></select></div></div>
     <label>Notes</label><textarea class="nt" rows="2" placeholder="Optional">${esc(e.notes)}</textarea></div>`}).join('')+
    `<div class="bottom"><button class="ok full" onclick="saveRoom()">Save room</button></div>`;
}
async function saveRoom(){
  const rows=[];
  for(const c of document.querySelectorAll('[data-p]')){
    const vals={};
    c.querySelectorAll('[data-f]').forEach(i=>{
      const t=i.dataset.t, raw=i.value.trim();
      vals[i.dataset.f] = raw==='' ? null : (t==='num' ? Number(raw) : raw);
    });
    const tm=c.querySelector('.tm').value||hm(Date.now());
    rows.push({round_id:round.id,panel_id:c.dataset.p,vals,alarm:c.querySelector('.al').value,notes:c.querySelector('.nt').value,taken_at:new Date(`${round.walk_date}T${tm}`).toISOString()});
  }
  const {error}=await sb.from('readings').upsert(rows,{onConflict:'round_id,panel_id'});
  if(error) return alert(error.message);
  roundView();
}

/* ---------- FINISH ---------- */
async function finish(){
  if(!confirm('Finish this walk and email the report?')) return;
  nav(null); app.innerHTML='<div class="empty">Building report…</div>';
  await sb.from('rounds').update({status:'done',finished_at:new Date().toISOString()}).eq('id',round.id);
  const b=await dayBook(site.id,round.walk_date); lastWb=b;
  saveFile(b);
  let msg='Report downloaded.';
  if(site.email){
    const file=b64(b.buf);
    const {error}=await sb.functions.invoke('send-report',{body:{to:site.email,subject:b.subject,filename:b.name,file}});
    msg=error?'Report downloaded, but email failed: '+error.message:'Report emailed to '+site.email;
  }
  app.innerHTML=`<div class="card" style="text-align:center;margin-top:10vh"><div style="font-size:3rem">✅</div><h2>Walk complete</h2><p class="mu">${esc(msg)}</p><button class="ok full" onclick="saveFile(lastWb)">⬇ Download Excel</button><br><br><div class="row2"><button class="g" onclick="dayView('${site.id}','${round.walk_date}')">Today’s walks</button><button onclick="home()">Done</button></div></div>`;
}

/* ---------- ADMIN ---------- */
function adminView(){
  $('#ttl').textContent='Admin';
  if(!adm.site){
    app.innerHTML=`<div class="top"><h2 style="margin:0">Sites</h2><button onclick="addSite()">+ Add site</button></div>`+
    (S.sites.length?S.sites.map(s=>`<div class="item" onclick="adm={site:'${s.id}'};adminView()"><span><b>${esc(s.name)}</b><small>${S.rooms.filter(r=>r.site_id===s.id).length} rooms · ${esc(s.email||'no report email')}</small></span><span class="ch">›</span></div>`).join(''):'<div class="empty">No sites yet. Tap “+ Add site”.</div>');
  } else if(!adm.room){
    const s=S.sites.find(x=>x.id===adm.site);
    app.innerHTML=`<div class="top"><button class="g sm" onclick="adm={};adminView()">← Sites</button>
    <div style="display:flex;gap:.4rem">
      <button class="g sm" onclick="editSite('${s.id}')">Edit site</button>
      <button class="r sm" onclick="delSite('${s.id}')">Delete site</button>
    </div></div>
    <div class="top"><h2 style="margin:0">${esc(s.name)}</h2><button onclick="addRoom('${s.id}')">+ Add room</button></div><small>Report email: ${esc(s.email||'none')}</small><br><br>`+
    (S.rooms.filter(r=>r.site_id===s.id).map(r=>`<div class="item" onclick="adm.room='${r.id}';adminView()"><span><b>${esc(r.name)}</b><small>${S.panels.filter(p=>p.room_id===r.id).length} panels</small></span><span class="ch">›</span></div>`).join('')||'<div class="empty">No rooms yet. Tap “+ Add room”.</div>');
  } else {
    const r=S.rooms.find(x=>x.id===adm.room);
    app.innerHTML=`<div class="top"><button class="g sm" onclick="adm.room=null;adminView()">← Rooms</button><button class="r sm" onclick="del('rooms','${r.id}')">Delete room</button></div>
    <div class="top"><h2 style="margin:0">${esc(r.name)}</h2><button onclick="addPanel('${r.id}')">+ Add panel</button></div>`+
    (S.panels.filter(p=>p.room_id===r.id).map(p=>`<div class="card"><div class="top" style="margin:0"><span><b>${esc(p.name)}</b><br><small>${esc(p.fields.map(fbase).join(' · '))}</small></span>
      <div style="display:flex;gap:.3rem">
        <button class="g sm" onclick="panelSheet('${r.id}', S.panels.find(x=>x.id==='${p.id}'))">Edit</button>
        <button class="r sm" onclick="del('panels','${p.id}')">Delete</button>
      </div></div></div>`).join('')||'<div class="empty">No panels yet. Tap “+ Add panel”.</div>');
  }
}
async function ins(t,o){const {error}=await sb.from(t).insert(o);if(error){alert(error.message);return false}await load();adminView()}
function addSite(){sheet('New site',`<label>Site name</label><input name="n" placeholder="e.g. Smouha DC"><label>Report email(s)</label><input name="e" placeholder="a@x.com, b@x.com">`,
  d=>val(d,'n')?ins('sites',{name:val(d,'n'),email:val(d,'e')||null}):false)}
function editSite(id){const s=S.sites.find(x=>x.id===id);sheet('Edit site',`<label>Site name</label><input name="n" value="${esc(s.name)}"><label>Report email(s)</label><input name="e" value="${esc(s.email)}">`,
  async d=>{const {error}=await sb.from('sites').update({name:val(d,'n')||s.name,email:val(d,'e')||null}).eq('id',id);if(error){alert(error.message);return false}await load();adminView()})}
async function delSite(id){
  const s=S.sites.find(x=>x.id===id);
  const rooms=S.rooms.filter(r=>r.site_id===id);
  const panels=S.panels.filter(p=>rooms.some(r=>r.id===p.room_id));
  const msg=`Delete "${s.name}"?\n\nThis will remove ${rooms.length} room(s) and ${panels.length} panel(s).\nAll rounds and readings for this site will also be removed. This cannot be undone.`;
  if(!confirm(msg)) return;
  // Best-effort cascade: delete in dependency order
  try {
    const {data:rr}=await sb.from('rounds').select('id').eq('site_id',id);
    const rids=(rr||[]).map(r=>r.id);
    if(rids.length) await sb.from('readings').delete().in('round_id',rids);
    if(rids.length) await sb.from('rounds').delete().eq('site_id',id);
    if(panels.length) await sb.from('readings').delete().in('panel_id',panels.map(p=>p.id));
    if(panels.length) await sb.from('panels').delete().in('id',panels.map(p=>p.id));
    if(rooms.length) await sb.from('rooms').delete().eq('site_id',id);
    const {error}=await sb.from('sites').delete().eq('id',id);
    if(error) throw error;
    await load(); adm={}; adminView();
  } catch(e){
    alert('Delete failed: '+e.message);
  }
}
function addRoom(site_id){sheet('New room',`<label>Room name</label><input name="n" placeholder="e.g. Utility A">`,d=>val(d,'n')?ins('rooms',{site_id,name:val(d,'n')}):false)}
function addPanel(room_id){panelSheet(room_id,null)}
function panelSheet(room_id, existing){
  const name = existing?.name || '';
  const fields = existing?.fields || ['Voltage (V)','Current (A)','Power (kW)'];
  sheet(existing?'Edit panel':'New panel',
    `<label>Panel name</label>
     <input name="n" value="${esc(name)}" placeholder="e.g. MDB A">
     <label>Readings (comma separated)</label>
     <input name="f" value="${esc(fields.join(', '))}">
     <small>Add :ok after a name for an OK/Alarm dropdown, or :txt for free text.</small>
     ${existing?'<small style="color:var(--mu)">Note: removing a field hides it going forward but keeps old data.</small>':''}`,
    async d=>{
      const n = val(d,'n');
      const flds = val(d,'f').split(',').map(s=>s.trim()).filter(Boolean);
      if(!n || !flds.length) return false;
      if(existing){
        const {error} = await sb.from('panels').update({name:n,fields:flds}).eq('id',existing.id);
        if(error){ alert(error.message); return false; }
      } else {
        const {error} = await sb.from('panels').insert({room_id,name:n,fields:flds});
        if(error){ alert(error.message); return false; }
      }
      await load(); adminView();
    });
}
async function del(t,id){
  if(t==='panels'){
    const {count}=await sb.from('readings').select('*',{count:'exact',head:true}).eq('panel_id',id);
    if(count){ alert(`This panel has ${count} reading(s) in history and cannot be deleted.\nUse "Edit" instead to rename it or change its fields.`); return; }
  }
  if(!confirm('Delete?'))return;
  const {error}=await sb.from(t).delete().eq('id',id);
  if(error){ alert(error.message); return; }
  if(t==='rooms')adm.room=null;
  await load();adminView();
}

init();
